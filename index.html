<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Daily Tracker"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>Daily Tracker</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07101f;color:#f4f7fb}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}h1{margin:6px 0}small,.muted{color:#9daac0}.card{background:#111c2f;border:1px solid #263650;border-radius:18px;padding:17px;margin:12px 0}.hero{background:linear-gradient(135deg,#244b82,#111c2f)}.big{font-size:34px;font-weight:800;margin:8px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:22px;font-weight:750;margin-top:5px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:#69a4ff;color:#07101f}button.alt{background:#17243a;color:#fff;border:1px solid #263650}input,select{width:100%;padding:12px;background:#0a1425;color:#fff;border:1px solid #263650;border-radius:12px;margin:6px 0 12px;font:inherit}.row{display:flex;gap:8px}.row>*{flex:1}.item{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #263650;padding:11px 0}.screen{display:none}.screen.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:auto;display:flex;background:#091321ee;border-top:1px solid #263650;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{flex:1;background:transparent;color:#9daac0;padding:7px 2px;font-size:11px}.nav button.active{color:#69a4ff}.nav span{display:block;font-size:20px}dialog{background:#111c2f;color:#fff;border:1px solid #263650;border-radius:18px;width:min(92%,520px)}dialog::backdrop{background:#000b}.progress{height:9px;background:#263650;border-radius:9px;overflow:hidden;margin:5px 0 12px}.fill{height:100%;background:#55d68b}.danger{color:#ff7280}.pink{color:#ff78b7}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>Daily Tracker</h1><div id="date" class="muted"></div>
<section id="home" class="screen active"><div class="card hero"><div class="muted">CURRENT BALANCE</div><div id="balance" class="big">€0.00</div><button onclick="openTxn()">+ Transaction</button> <button class="alt" onclick="openFood()">+ Food</button></div><div class="grid"><div class="card"><div class="muted">SPENT THIS MONTH</div><div id="spent" class="stat danger">€0.00</div></div><div class="card"><div class="muted">THE BUB</div><div id="bubMonth" class="stat pink">€0.00</div></div><div class="card"><div class="muted">CALORIES TODAY</div><div id="calToday" class="stat">0</div></div><div class="card"><div class="muted">PROTEIN TODAY</div><div id="proToday" class="stat">0g</div></div></div><div class="card"><b>Today's macros</b><div id="macros"></div></div></section>
<section id="money" class="screen"><div class="card"><h2>Money</h2><button onclick="openTxn()">+ Add transaction</button><div id="txns"></div></div></section>
<section id="food" class="screen"><div class="card"><h2>Food</h2><button onclick="openFood()">+ Add food</button><div id="foods"></div></div></section>
<section id="bub" class="screen"><div class="card"><h2>The Bub ❤️</h2><button onclick="openBub()">+ Add payment</button><div id="bubs"></div></div></section>
<section id="settings" class="screen"><div class="card"><h2>Settings</h2><label>Opening balance</label><input id="opening" type="number" step=".01"><div class="row"><div><label>Calories</label><input id="tcal" type="number"></div><div><label>Protein g</label><input id="tpro" type="number"></div></div><div class="row"><div><label>Carbs g</label><input id="tcarb" type="number"></div><div><label>Fat g</label><input id="tfat" type="number"></div></div><button onclick="saveSettings()">Save</button></div><div class="card"><h2>Backup</h2><button class="alt" onclick="backup()">Export JSON</button><input id="restore" type="file" accept="application/json" onchange="restoreData(event)"></div></section></main>
<nav class="nav"><button class="active" onclick="show('home',this)"><span>🏠</span>Home</button><button onclick="show('money',this)"><span>💰</span>Money</button><button onclick="show('food',this)"><span>🍗</span>Food</button><button onclick="show('bub',this)"><span>❤️</span>Bub</button><button onclick="show('settings',this)"><span>⚙️</span>Settings</button></nav>
<dialog id="txnDlg"><form method="dialog" onsubmit="saveTxn(event)"><h2>Add transaction</h2><label>Type</label><select id="ttype"><option value="expense">Expense</option><option value="income">Income</option></select><label>Description</label><input id="tdesc" required><div class="row"><div><label>Amount €</label><input id="tamt" type="number" min=".01" step=".01" required></div><div><label>Date</label><input id="tdate" type="date" required></div></div><label>Category</label><select id="tcat"><option>Groceries</option><option>Takeaway</option><option>Fuel</option><option>Gaming</option><option>Subscriptions</option><option>Salary</option><option>Other</option></select><button>Save</button> <button type="button" class="alt" onclick="txnDlg.close()">Cancel</button></form></dialog>
<dialog id="foodDlg"><form method="dialog" onsubmit="saveFood(event)"><h2>Add food</h2><label>Food / meal</label><input id="fname" required><label>Date</label><input id="fdate" type="date" required><div class="row"><div><label>Calories</label><input id="fcal" type="number" min="0" required></div><div><label>Protein g</label><input id="fpro" type="number" min="0" step=".1" required></div></div><div class="row"><div><label>Carbs g</label><input id="fcarb" type="number" min="0" step=".1" required></div><div><label>Fat g</label><input id="ffat" type="number" min="0" step=".1" required></div></div><button>Save</button> <button type="button" class="alt" onclick="foodDlg.close()">Cancel</button></form></dialog>
<dialog id="bubDlg"><form method="dialog" onsubmit="saveBub(event)"><h2>Payment to The Bub</h2><label>Description</label><input id="bdesc" required><div class="row"><div><label>Amount €</label><input id="bamt" type="number" min=".01" step=".01" required></div><div><label>Date</label><input id="bdate" type="date" required></div></div><label>Type</label><select id="btype"><option>Gift</option><option>Loan</option><option>Shared expense</option></select><button>Save</button> <button type="button" class="alt" onclick="bubDlg.close()">Cancel</button></form></dialog>
<script>const K='dailyTrackerV1';let d=JSON.parse(localStorage.getItem(K)||'null')||{settings:{opening:0,cal:2300,pro:180,carb:250,fat:75},tx:[],food:[],bub:[]};const day=()=>{let x=new Date(),o=x.getTimezoneOffset();return new Date(x-o*60000).toISOString().slice(0,10)},eur=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(+n||0),save=()=>{localStorage.setItem(K,JSON.stringify(d));render()},sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0),month=x=>x.date.slice(0,7)===day().slice(0,7);function show(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function openTxn(){tdate.value=day();txnDlg.showModal()}function saveTxn(e){e.preventDefault();d.tx.push({type:ttype.value,description:tdesc.value,amount:+tamt.value,date:tdate.value,category:tcat.value});e.target.reset();txnDlg.close();save()}function openFood(){fdate.value=day();foodDlg.showModal()}function saveFood(e){e.preventDefault();d.food.push({name:fname.value,date:fdate.value,cal:+fcal.value,pro:+fpro.value,carb:+fcarb.value,fat:+ffat.value});e.target.reset();foodDlg.close();save()}function openBub(){bdate.value=day();bubDlg.showModal()}function saveBub(e){e.preventDefault();d.bub.push({description:bdesc.value,amount:+bamt.value,date:bdate.value,type:btype.value});e.target.reset();bubDlg.close();save()}function saveSettings(){d.settings={opening:+opening.value,cal:+tcal.value,pro:+tpro.value,carb:+tcarb.value,fat:+tfat.value};save()}function del(kind,i){if(confirm('Delete this entry?')){d[kind].splice(i,1);save()}}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='daily-tracker-backup.json';a.click();URL.revokeObjectURL(u)}function restoreData(e){let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save()}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}function p(label,v,t){let pc=Math.min(100,t?100*v/t:0);return `<div><small>${label}: ${Math.round(v)} / ${t}</small><div class="progress"><div class="fill" style="width:${pc}%"></div></div></div>`}function render(){date.textContent=new Date().toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'});let inc=sum(d.tx.filter(x=>x.type==='income'),'amount'),exp=sum(d.tx.filter(x=>x.type==='expense'),'amount'),bp=sum(d.bub,'amount'),bal=d.settings.opening+inc-exp-bp,mexp=sum(d.tx.filter(x=>x.type==='expense'&&month(x)),'amount'),mb=sum(d.bub.filter(month),'amount'),fd=d.food.filter(x=>x.date===day()),cal=sum(fd,'cal'),pro=sum(fd,'pro'),carb=sum(fd,'carb'),fat=sum(fd,'fat');balance.textContent=eur(bal);spent.textContent=eur(mexp+mb);bubMonth.textContent=eur(mb);calToday.textContent=Math.round(cal);proToday.textContent=Math.round(pro)+'g';macros.innerHTML=p('Calories',cal,d.settings.cal)+p('Protein',pro,d.settings.pro)+p('Carbs',carb,d.settings.carb)+p('Fat',fat,d.settings.fat);txns.innerHTML=d.tx.length?d.tx.map((x,i)=>`<div class="item"><div><b>${x.description}</b><br><small>${x.category} · ${x.date}</small></div><div>${x.type==='income'?'+':'-'}${eur(x.amount)} <button class="alt" onclick="del('tx',${i})">×</button></div></div>`).join(''):'<p class="muted">No transactions yet.</p>';foods.innerHTML=d.food.length?d.food.map((x,i)=>`<div class="item"><div><b>${x.name}</b><br><small>${x.date} · ${x.cal} kcal · P ${x.pro}g</small></div><button class="alt" onclick="del('food',${i})">×</button></div>`).join(''):'<p class="muted">No food yet.</p>';bubs.innerHTML=d.bub.length?d.bub.map((x,i)=>`<div class="item"><div><b>${x.description}</b><br><small>${x.type} · ${x.date}</small></div><div>${eur(x.amount)} <button class="alt" onclick="del('bub',${i})">×</button></div></div>`).join(''):'<p class="muted">No payments yet.</p>';opening.value=d.settings.opening;tcal.value=d.settings.cal;tpro.value=d.settings.pro;tcarb.value=d.settings.carb;tfat.value=d.settings.fat}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));render()</script></body></html>
